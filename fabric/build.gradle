plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base.archivesName = 'multisolo'
evaluationDependsOn(':network')

loom {
    splitEnvironmentSourceSets()
    mods {
        multisolo {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'multisolo-test'
        enableGameTests = false
        enableClientGameTests = true
        eula = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    implementation project(':core')
    implementation project(':network')
    // These modules (and their transitive nested dependencies) ship inside our one JAR.
    for (module in ['fabric-api-base', 'fabric-lifecycle-events-v1', 'fabric-screen-api-v1', 'fabric-resource-loader-v1']) {
        implementation include(fabricApi.module(module, rootProject.fabric_api_version))
    }
    gametestImplementation fabricApi.module('fabric-client-gametest-api-v1', rootProject.fabric_api_version)
    gametestImplementation fabricApi.module('fabric-resource-loader-v1', rootProject.fabric_api_version)
    gametestImplementation project(':relay')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(rootProject.java_version)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = Integer.parseInt(rootProject.java_version)
}

processResources {
    def properties = [
        version: project.version,
        minecraft_version: rootProject.minecraft_version,
        minecraft_dependency_version: rootProject.minecraft_dependency_version,
        loader_version: rootProject.loader_version,
        java_version: rootProject.java_version
    ]
    inputs.properties properties
    filesMatching('fabric.mod.json') {
        expand properties
    }
}

jar {
    // Our own core classes are packaged inside the only distributable mod JAR.
    from project(':core').sourceSets.main.output
    from project(':network').sourceSets.main.output
    from(rootProject.file('LICENSE')) { rename { 'LICENSE_multisolo' } }
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('sourcesJar') {
    from project(':core').sourceSets.main.allSource
    from project(':network').sourceSets.main.allSource
}
