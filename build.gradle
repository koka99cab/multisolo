plugins {
    id 'base'
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

tasks.named('check') {
    dependsOn ':core:check', ':network:check', ':relay:check', ':fabric:check'
}

tasks.named('assemble') {
    dependsOn ':core:assemble', ':network:assemble', ':relay:assemble', ':fabric:assemble'
}
