name: Build and verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v5
      - name: Verify repository
        run: python scripts/verify_repository.py
      - name: Test version detection
        run: python -m unittest discover -s scripts/tests
      - name: Build on Linux
        if: runner.os != 'Windows'
        run: ./gradlew build --console=plain
      - name: Build on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat build --console=plain
      - name: Check Fabric bootstrap on Linux
        if: runner.os != 'Windows'
        run: ./gradlew :fabric:runServer --args=nogui --console=plain
      - name: Check Fabric bootstrap on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat :fabric:runServer --args=nogui --console=plain
      - name: Verify distribution and bootstrap
        run: python scripts/verify_distribution.py --bootstrap-log fabric/run/logs/latest.log
      - uses: actions/upload-artifact@v4
        with:
          name: multisolo-development-${{ runner.os }}
          path: fabric/build/libs/*.jar
          if-no-files-found: error
